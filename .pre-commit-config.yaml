repos:
  - repo: local
    hooks:
      # Supyrliminal (SL) and PYD checks together.
      - id: supyrliminal
        name: Supyrliminal
        entry: flake8 --select=SL,PYD
        language: python
        types_or: [python, pyi]
        require_serial: true
        additional_dependencies:
          - flake8>=5.0
          - flake8-pydantic>=0.4
      - id: no-co-authored-by
        name: forbid Co-Authored-By trailer
        entry: bash -c '! grep -iE "^Co-Author[^:]*:" "$1" >/dev/null'
        language: system
        args: ["<COMMIT_MSG_FILE>"]
        stages: [commit-msg]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
