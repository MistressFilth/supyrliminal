[project]
name = "supyrliminal"
description = "Boundary-aware Pydantic linter (SL) for flake8"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "flake8>=5.0", "flake8-pydantic>=0.4"]

[project.scripts]
supyrliminal = "supyrliminal._cli:main"
sl = "supyrliminal._cli:main"

[project.entry-points."flake8.extension"]
SL = "supyrliminal.flake8_supyrliminal:SLPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supyrliminal"]
include = ["supyrliminal/_rules/*.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=2.0.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
