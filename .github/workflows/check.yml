name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Format check
        run: uv run ruff format --check .
      - name: Unit tests
        run: make unit-test
